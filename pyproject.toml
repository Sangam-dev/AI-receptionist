[project]
name = "receptionist"
version = "0.1.0"
description = "Voice receptionist agent"
readme = "README.md"
authors = [
    { name = "Sangam-dev", email = "parajulis295@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi[standard]>=0.143.2",
    "kokoro-onnx>=0.6.1",
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "pydantic>=2.14.1",
    "soundfile>=0.14.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

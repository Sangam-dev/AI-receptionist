<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receptionist</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 1.25rem; }
  #status { font-size: 0.8rem; color: #94a3b8; }
  #transcript { background: #1e293b; border-radius: 8px; min-height: 200px; max-height: 320px; overflow-y: auto; padding: 1rem; margin: 1rem 0; white-space: pre-wrap; }
  .user { color: #7dd3fc; }
  .agent { color: #f1f5f9; }
  .muted { color: #64748b; font-style: italic; }
  #controls { display: flex; gap: 0.5rem; }
  #text { flex: 1; padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; }
  button { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  #stop { background: #dc2626; display: none; }
</style>
</head>
<body>
<h1>Clinic Receptionist</h1>
<div id="status">connecting…</div>
<div id="transcript"></div>
<div id="controls">
  <input id="text" placeholder="Type a message…" autocomplete="off">
  <button id="send">Send</button>
  <button id="stop">Stop</button>
</div>
<script>
const $ = (id) => document.getElementById(id);
const transcript = $("transcript"), statusEl = $("status");
const textEl = $("text"), sendBtn = $("send"), stopBtn = $("stop");

let ws, audioCtx, sessionEl = null;
let currentTurn = null, cancelTimer = null;
let cancelledTurns = new Set();
let scheduledEnd = 0;
const activeSources = [];

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    statusEl.textContent = "ready";
    ws.send(JSON.stringify({ type: "auth", token: "dev-token" }));
  };
  ws.onerror = () => { statusEl.textContent = "connection error"; };
  ws.onclose = () => { statusEl.textContent = "disconnected — retrying…"; setTimeout(connect, 1500); };
  ws.onmessage = (event) => handleFrame(JSON.parse(event.data));
}

function addLine(cls, text, replace) {
  let el = sessionEl;
  if (!el || replace) {
    el = document.createElement("div");
    el.className = cls;
    transcript.appendChild(el);
    sessionEl = el;
  }
  el.textContent = replace === true ? (el.textContent + text) : text;
  transcript.scrollTop = transcript.scrollHeight;
  return el;
}

function newTurn() {
  currentTurn = null;
  sessionEl = null;
  addLine("agent", "… ", true);   // placeholder replaced by first partial
}

function handleFrame(f) {
  if (cancelledTurns.has(f.turn_id) && f.type !== "turn_cancelled" && f.type !== "turn_complete") return;
  switch (f.type) {
    case "ready":
      sessionEl = null;
      break;
    case "response_partial":
      if (f.turn_id !== currentTurn) {
        currentTurn = f.turn_id;
        sessionEl = null;
        showStop(true);
        stopAudio();
        scheduledEnd = 0;
      }
      if (!sessionEl) {
        sessionEl = addLine("agent", "", false);
      } else {
        sessionEl.className = "agent";
        transcript.appendChild(sessionEl);
      }
      sessionEl.textContent += f.text;
      transcript.scrollTop = transcript.scrollHeight;
      break;
    case "response":
      showStop(false);
      break;
    case "audio":
      if (f.turn_id === currentTurn) playAudio(f);
      break;
    case "turn_cancelled":
      cancelledTurns.add(f.turn_id);
      stopAudio();
      showStop(false);
      sessionEl = null;
      break;
    case "turn_complete":
      cancelledTurns.delete(f.turn_id);
      showStop(false);
    case "error":
      addLine("muted", f.message, false);
      break;
  }
}

function showStop(on) { stopBtn.style.display = on ? "block" : "none"; }

async function playAudio(frame) {
  try {
    ensureAudioCtx();
    if (audioCtx.state !== "running") {
      await audioCtx.resume();
      if (audioCtx.state !== "running") {
        statusEl.textContent = "🔇 muted — click anywhere, audio queued";
      }
    }
    console.log("[audio] scheduling chunk#", frame.seq, "state:", audioCtx.state, "currentTime:", audioCtx.currentTime.toFixed(3));
    const b64 = atob(frame.pcm);
    const bytes = new Uint8Array(b64.length);
    for (let i = 0; i < b64.length; i++) bytes[i] = b64.charCodeAt(i);
    const int16 = new Int16Array(bytes.buffer);
    const samples = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) samples[i] = int16[i] / 32768;
    const buffer = audioCtx.createBuffer(1, samples.length, frame.sample_rate);
    buffer.copyToChannel(samples, 0);
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);
    const when = Math.max(audioCtx.currentTime + 0.05, scheduledEnd);
    source.start(when);
    scheduledEnd = when + buffer.duration;
    activeSources.push(source);
    statusEl.textContent = "🔊 speaking chunk #" + frame.seq;
    source.onended = () => {
      const i = activeSources.indexOf(source);
      if (i >= 0) activeSources.splice(i, 1);
      if (activeSources.length === 0) statusEl.textContent = "ready";
    };
  } catch (err) {
    console.error("audio playback failed:", err);
    addLine("muted", "(audio playback error — see console)", false);
  }
}

function ensureAudioCtx() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.onstatechange = () => {
    if (activeSources.length > 0) statusEl.textContent = "audio ctx: " + audioCtx.state;
  };
  console.log("[audio] context created, state:", audioCtx.state);
}

function userGesture() {
  ensureAudioCtx();
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume().then(() => console.log("[audio] context resumed, state:", audioCtx.state));
  }
}
document.addEventListener("pointerdown", userGesture);
document.addEventListener("keydown", userGesture);

function stopAudio() {
  for (const src of activeSources.splice(0)) { try { src.stop(); } catch {} }
  scheduledEnd = 0;
}

function sendUserText() {
  const text = textEl.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;
  addLine("user", `you: ${text}`, true);
  sessionEl = null;
  ws.send(JSON.stringify({ type: "user_text", text }));
  textEl.value = "";
}

function sendInterrupt() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "interrupt" }));
  stopAudio();
}

sendBtn.onclick = sendUserText;
textEl.addEventListener("keydown", (e) => { if (e.key === "Enter") sendUserText(); });
stopBtn.onclick = sendInterrupt;
connect();
</script>
</body>
</html>
